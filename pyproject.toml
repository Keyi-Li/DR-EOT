[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreot"
version = "0.1.0"
description = "Density-Reweighted Entropic Optimal Transport"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Keyi Li", email = "keyi.y.li@yale.edu"},
  {name = "Boris Landa", email = "boris.landa@yale.edu"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "loguru>=0.7",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
benchmark = ["pot>=0.9"]   # POT library needed for UOT baseline in Fig 4

[tool.setuptools.packages.find]
where = ["."]
include = ["dreot*"]
